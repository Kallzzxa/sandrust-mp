[package]
name = "samp-launcher-gui"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "MC-RP Launcher: a Win32 server-browser GUI front-end for samp-launcher (SA:MP 0.3.7 / 0.3.DL-R1)"

[[bin]]
name = "mc-rp-launcher"
path = "src/main.rs"

[dependencies]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
