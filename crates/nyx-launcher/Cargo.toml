[package]
name = "nyx-launcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "NYX Launcher: an eframe/egui front-end for samp-launcher (SA:MP 0.3.7 / 0.3.DL-R1)"

[[bin]]
name = "nyx-launcher"
path = "src/main.rs"

[dependencies]
eframe = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", features = ["jpeg", "png"] }
